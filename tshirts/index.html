<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="RAWQ — Custom T-Shirts made for your story.">

  <title>RAWQ — Custom T-Shirts</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

  <style>

    /* =========================
       RAWQ COLOR PALETTE
    ========================== */

    :root {
      --red: #D92828;
      --red-dark: #7D171C;
      --rose: #F47C82;

      --black: #111111;
      --charcoal: #1C1C1C;

      --white: #FFFFFF;
      --muted: #A7A7A7;

      --border: rgba(255,255,255,0.10);

      --max-width: 1200px;
    }


    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }


    /* =========================
       NAVBAR
    ========================== */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 78px;

      padding: 0 5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 1000;

      background: rgba(17,17,17,0.72);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 0.9;
    }

    .brand-mark {
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.25em;
    }

    .brand-sub {
      font-size: 0.42rem;
      letter-spacing: 0.28em;
      color: var(--rose);
      margin-top: 6px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;

      font-size: 0.82rem;
      font-weight: 600;
    }

    .nav-links a:not(.nav-cta) {
      color: #ddd;
      transition: 0.25s;
    }

    .nav-links a:not(.nav-cta):hover {
      color: var(--rose);
    }

    .nav-cta {
      background: var(--red);
      padding: 11px 17px;
      border-radius: 999px;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
    }

    .menu-toggle span {
      display: block;
      width: 25px;
      height: 2px;
      background: white;
      margin: 5px;
    }


    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;

      max-width: 1400px;
      margin: auto;

      padding: 150px 6% 70px;

      display: grid;
      grid-template-columns: 1.05fr 0.95fr;

      align-items: center;

      gap: 30px;

      position: relative;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 620px;
      height: 620px;

      right: -160px;
      top: 70px;

      background:
        radial-gradient(
          circle,
          rgba(217,40,40,0.28),
          transparent 65%
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: var(--rose);

      font-size: 0.72rem;

      font-weight: 800;

      letter-spacing: 0.24em;

      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(3.1rem, 7vw, 7rem);

      line-height: 0.9;

      letter-spacing: -0.065em;

      font-weight: 900;
    }

    .hero h1 span {
      color: var(--red);
    }

    .hero-copy {
      max-width: 530px;

      color: #bbb;

      margin: 28px 0;

      font-size: 1rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 14px;

      padding: 14px 21px;

      border-radius: 5px;

      font-weight: 800;

      font-size: 0.78rem;

      letter-spacing: 0.04em;

      border: 1px solid transparent;

      transition: 0.25s;

      cursor: pointer;
    }

    .btn-primary {
      background: var(--red);
      color: white;
    }

    .btn-primary:hover {
      background: #ef3434;
      transform: translateY(-2px);
    }

    .btn-ghost {
      border-color: var(--border);
      color: white;
    }

    .btn-ghost:hover {
      border-color: var(--rose);
    }


    /* HERO STATS */

    .hero-meta {
      display: flex;
      gap: 35px;

      margin-top: 60px;
    }

    .hero-meta div {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .hero-meta strong {
      font-size: 0.72rem;
      color: var(--red);
    }

    .hero-meta span {
      color: #999;

      font-size: 0.62rem;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }


    /* =========================
       HERO T-SHIRT VISUAL
    ========================== */

    .hero-visual {
      min-height: 580px;

      display: grid;

      place-items: center;

      position: relative;
    }

    .visual-ring {
      width: 450px;
      height: 450px;

      border: 1px solid rgba(244,124,130,0.25);

      border-radius: 50%;

      position: absolute;

      box-shadow:
        0 0 100px rgba(217,40,40,0.16);
    }

    .shirt-card {
      position: relative;

      width: 290px;
      height: 390px;

      filter:
        drop-shadow(
          0 35px 35px rgba(0,0,0,0.5)
        );
    }

    .shirt-body {
      position: absolute;

      inset: 70px 52px 0;

      background:
        linear-gradient(
          145deg,
          #262626,
          #0b0b0b
        );

      border-radius: 15px 15px 4px 4px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      border: 1px solid #333;
    }

    .shirt-body span {
      font-size: 2rem;

      font-weight: 900;

      letter-spacing: 0.2em;
    }

    .shirt-body small {
      font-size: 0.48rem;

      color: var(--rose);

      letter-spacing: 0.22em;

      margin-top: 6px;
    }

    .shirt-neck {
      position: absolute;

      z-index: 2;

      width: 76px;
      height: 42px;

      left: 107px;
      top: 55px;

      border-radius: 50%;

      background: #0c0c0c;

      border: 1px solid #333;
    }

    .shirt-sleeve {
      position: absolute;

      top: 77px;

      width: 90px;
      height: 150px;

      background: #1d1d1d;

      border: 1px solid #333;
    }

    .shirt-sleeve.left {
      left: 8px;

      transform: rotate(19deg);

      border-radius:
        15px 5px 25px 18px;
    }

    .shirt-sleeve.right {
      right: 8px;

      transform: rotate(-19deg);

      border-radius:
        5px 15px 18px 25px;
    }

    .floating-tag {
      position: absolute;

      border: 1px solid rgba(255,255,255,0.2);

      background: rgba(17,17,17,0.72);

      backdrop-filter: blur(8px);

      padding: 9px 12px;

      font-size: 0.55rem;

      letter-spacing: 0.18em;

      color: #ddd;
    }

    .tag-one {
      top: 22%;
      left: 8%;
    }

    .tag-two {
      right: 6%;
      bottom: 21%;

      color: var(--rose);
    }


    /* =========================
       TICKER
    ========================== */

    .ticker {
      overflow: hidden;

      white-space: nowrap;

      border-block: 1px solid var(--border);

      padding: 14px 0;

      color: #888;

      font-size: 0.68rem;

      letter-spacing: 0.25em;
    }

    .ticker div {
      display: inline-block;

      animation:
        ticker 20s linear infinite;
    }

    .ticker span {
      color: var(--red);

      margin: 0 20px;
    }

    @keyframes ticker {
      to {
        transform: translateX(-30%);
      }
    }


    /* =========================
       GENERAL SECTION
    ========================== */

    .section {
      max-width: var(--max-width);

      margin: auto;

      padding: 120px 5%;
    }

    .section-heading {
      display: flex;

      justify-content: space-between;

      align-items: end;

      gap: 20px;

      margin-bottom: 45px;
    }

    .section-heading h2 {
      font-size: clamp(2.5rem,5vw,5rem);

      line-height: 0.9;

      letter-spacing: -0.06em;

      font-weight: 900;
    }

    .section-heading h2 span {
      color: var(--red);
    }

    .text-link {
      color: #aaa;

      font-size: 0.75rem;

      border-bottom: 1px solid #555;

      padding-bottom: 5px;
    }


    /* =========================
       PRODUCTS
    ========================== */

    .product-grid {
      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 18px;
    }

    .product-card {
      min-width: 0;
    }

    .product-image {
      height: 470px;

      position: relative;

      display: grid;

      place-items: center;

      overflow: hidden;
    }

    .product-image::after {
      content: "";

      position: absolute;

      inset: 15px;

      border: 1px solid
        rgba(255,255,255,0.07);
    }

    .product-image span {
      font-size: 2rem;

      font-weight: 900;

      letter-spacing: 0.15em;

      z-index: 1;
    }

    .black-shirt {
      background:
        linear-gradient(
          145deg,
          #282828,
          #090909
        );
    }

    .red-shirt {
      background:
        linear-gradient(
          145deg,
          #e33a3a,
          #79161b
        );
    }

    .white-shirt {
      background:
        linear-gradient(
          145deg,
          #eee,
          #bcbcbc
        );

      color: #111;
    }

    .product-info {
      display: flex;

      justify-content: space-between;

      gap: 20px;

      padding: 17px 2px;

      border-bottom: 1px solid var(--border);
    }

    .product-info h3 {
      font-size: 0.9rem;
    }

    .product-info p {
      color: #777;

      font-size: 0.65rem;

      margin-top: 5px;
    }

    .product-info strong {
      font-size: 0.85rem;

      color: var(--rose);
    }


    /* =========================
       CUSTOMIZE
    ========================== */

    .custom-section {
      background:
        linear-gradient(
          135deg,
          #1c1c1c,
          #130a0a 55%,
          #7d171c
        );

      padding:
        110px
        max(5%, calc((100% - 1100px)/2));

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 80px;
    }

    .custom-section h2 {
      font-size:
        clamp(2.7rem,5vw,5.2rem);

      line-height: 0.9;

      letter-spacing: -0.06em;
    }

    .custom-section h2 span {
      color: var(--red);
    }

    .custom-section p:not(.eyebrow) {
      color: #c4c4c4;

      margin: 25px 0 30px;

      max-width: 520px;
    }

    .custom-steps {
      display: grid;
    }

    .step {
      display: grid;

      grid-template-columns: 60px 1fr;

      gap: 15px;

      padding: 22px 0;

      border-bottom:
        1px solid rgba(255,255,255,0.16);
    }

    .step b {
      color: var(--rose);

      font-size: 0.75rem;
    }

    .step h3 {
      font-size: 1rem;
    }

    .step p {
      margin: 5px 0 0 !important;

      font-size: 0.78rem;

      color: #999 !important;
    }


    /* =========================
       COLLECTIONS
    ========================== */

    .collection-grid {
      display: grid;

      grid-template-columns: 2fr 1fr;

      grid-template-rows:
        250px 250px;

      gap: 15px;
    }

    .collection-card {
      padding: 30px;

      position: relative;

      overflow: hidden;

      display: flex;

      justify-content: space-between;

      align-items: end;

      border: 1px solid var(--border);
    }

    .collection-card::before {
      content: "";

      position: absolute;

      width: 250px;
      height: 250px;

      right: -70px;
      top: -70px;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.05);
    }

    .collection-card h3 {
      font-size: 2rem;

      line-height: 0.95;

      position: relative;
    }

    .collection-card p {
      color: var(--rose);

      font-size: 0.65rem;

      margin-bottom: 10px;

      position: relative;
    }

    .collection-card > span {
      font-size: 1.4rem;

      position: relative;
    }

    .collection-large {
      grid-row: 1 / 3;

      background:
        linear-gradient(
          145deg,
          #262626,
          #101010
        );
    }

    .collection-red {
      background:
        linear-gradient(
          145deg,
          #d92828,
          #7d171c
        );
    }

    .collection-dark {
      background: #151515;
    }


    /* =========================
       ABOUT
    ========================== */

    .about-section {
      max-width: 1200px;

      margin: auto;

      padding: 120px 5%;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 80px;
    }

    .about-section h2 {
      font-size:
        clamp(3rem,5vw,5.5rem);

      line-height: 0.9;

      letter-spacing: -0.06em;
    }

    .about-section h2 span {
      color: var(--red);
    }

    .about-copy > p {
      color: #aaa;

      font-size: 1.05rem;

      max-width: 500px;
    }

    .stats {
      display: flex;

      gap: 40px;

      margin-top: 60px;
    }

    .stats div {
      display: flex;

      flex-direction: column;
    }

    .stats strong {
      font-size: 2rem;
    }

    .stats span {
      color: #777;

      font-size: 0.65rem;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }


    /* =========================
       CONTACT
    ========================== */

    .contact-section {
      padding: 80px 5% 120px;

      max-width: 1200px;

      margin: auto;
    }

    .contact-card {
      background: #191919;

      border: 1px solid var(--border);

      padding: 55px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 70px;
    }

    .contact-card h2 {
      font-size:
        clamp(2.7rem,5vw,5rem);

      line-height: 0.9;

      letter-spacing: -0.06em;
    }

    .contact-card h2 span {
      color: var(--red);
    }

    .contact-note {
      color: #888;

      max-width: 400px;

      margin-top: 25px;
    }

    form {
      display: grid;

      gap: 15px;
    }

    label {
      font-size: 0.65rem;

      color: #999;

      text-transform: uppercase;

      letter-spacing: 0.1em;
    }

    input,
    textarea {
      display: block;

      width: 100%;

      margin-top: 7px;

      border: 1px solid #333;

      background: #111;

      color: white;

      padding: 13px;

      outline: none;

      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--red);
    }

    .form-status {
      color: var(--rose);

      font-size: 0.75rem;
    }


    /* =========================
       FOOTER
    ========================== */

    footer {
      border-top:
        1px solid var(--border);

      padding: 35px 5%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      color: #666;

      font-size: 0.65rem;
    }

    .footer-brand {
      display: flex;

      flex-direction: column;

      color: white;
    }

    .footer-brand span {
      font-size: 1.2rem;

      font-weight: 900;

      letter-spacing: 0.2em;
    }

    .footer-brand small {
      color: var(--rose);

      letter-spacing: 0.18em;

      font-size: 0.42rem;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 850px) {

      .menu-toggle {
        display: block;
      }

      .nav-links {
        position: absolute;

        top: 78px;

        left: 0;
        right: 0;

        padding: 20px 5%;

        background: #111;

        display: none;

        flex-direction: column;

        align-items: stretch;

        border-bottom:
          1px solid var(--border);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-cta {
        text-align: center;
      }

      .hero {
        grid-template-columns: 1fr;

        padding-top: 125px;
      }

      .hero-visual {
        min-height: 430px;
      }

      .visual-ring {
        width: 330px;
        height: 330px;
      }

      .product-grid,
      .custom-section,
      .about-section,
      .contact-card {
        grid-template-columns: 1fr;
      }

      .collection-grid {
        grid-template-columns: 1fr;

        grid-template-rows:
          250px 250px 250px;
      }

      .collection-large {
        grid-row: auto;
      }

      .section-heading {
        align-items: flex-start;

        flex-direction: column;
      }

      .product-image {
        height: 390px;
      }

      .custom-section {
        gap: 50px;
      }

      .about-section {
        gap: 50px;
      }

      footer {
        flex-direction: column;

        align-items: flex-start;
      }
    }


    @media (max-width: 500px) {

      .navbar {
        height: 70px;
      }

      .nav-links {
        top: 70px;
      }

      .hero {
        padding-inline: 5%;
      }

      .hero-meta {
        gap: 18px;
      }

      .hero-meta span {
        font-size: 0.52rem;
      }

      .hero-visual {
        min-height: 380px;
      }

      .shirt-card {
        transform: scale(0.82);
      }

      .contact-card {
        padding: 30px 22px;
      }

      .section {
        padding-block: 85px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <header class="navbar" id="navbar">

    <a href="#home" class="brand">

      <span class="brand-mark">
        RAWQ
      </span>

      <span class="brand-sub">
        CUSTOM T-SHIRTS
      </span>

    </a>


    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Open menu"
      aria-expanded="false">

      <span></span>
      <span></span>
      <span></span>

    </button>


    <nav class="nav-links" id="navLinks">

      <a href="#home">
        Home
      </a>

      <a href="#shop">
        Shop
      </a>

      <a href="#customize">
        Customize
      </a>

      <a href="#collections">
        Collections
      </a>

      <a href="#about">
        About
      </a>

      <a href="#contact">
        Contact
      </a>

      <a href="#customize" class="nav-cta">
        Start Designing
      </a>

    </nav>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- HERO -->

    <section class="hero" id="home">

      <div class="hero-content">

        <p class="eyebrow">
          RAWQ / CUSTOM WEAR
        </p>

        <h1>
          WEAR
          <br>
          <span>YOUR STORY.</span>
        </h1>

        <p class="hero-copy">
          Premium custom T-shirts designed around
          your ideas, your style and your identity.
        </p>


        <div class="hero-actions">

          <a
            href="#customize"
            class="btn btn-primary">

            Customize Now
            <span>↗</span>

          </a>


          <a
            href="#shop"
            class="btn btn-ghost">

            Explore Collection

          </a>

        </div>


        <div class="hero-meta">

          <div>

            <strong>
              01
            </strong>

            <span>
              Custom
              <br>
              Designs
            </span>

          </div>


          <div>

            <strong>
              02
            </strong>

            <span>
              Premium
